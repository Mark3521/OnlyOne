name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release tag matches app version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          if [ "$TAG_NAME" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match app versionName $VERSION_NAME (expected v$VERSION_NAME)"
            exit 1
          fi
          echo "Release tag $TAG_NAME matches app version $VERSION_NAME."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate icon resources
        run: python tools/validate_icons.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 12 build platform
        run: sdkmanager "platforms;android-31" "build-tools;31.0.0"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle 7.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.2"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onlyone-release.p12"
          test -s "$RUNNER_TEMP/onlyone-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/onlyone-release.p12" >> "$GITHUB_ENV"
          echo "Release signing key prepared."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::One or more Android signing secrets are missing."
            exit 1
          fi
          gradle --no-daemon assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-release.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/31.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Verified signed APK: $APK_PATH"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OnlyOne ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            删去部分过时图标
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
